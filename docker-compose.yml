services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - "8000:80"
      - "5174:5173"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
